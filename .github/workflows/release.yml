name: Build and Release

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Boty-${{ github.ref_name }}-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boty-${{ github.ref_name }}-Android
          path: build/app/outputs/flutter-apk/Boty-${{ github.ref_name }}-Android.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libopencv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Zip Linux Bundle
        run: |
          cd build/linux/x64/release/bundle/
          zip -r $GITHUB_WORKSPACE/Boty-${{ github.ref_name }}-Linux.zip .

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Boty-${{ github.ref_name }}-Linux
          path: Boty-${{ github.ref_name }}-Linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows Release
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/Boty-${{ github.ref_name }}-Windows.zip

      - name: Upload Windows Exe
        uses: actions/upload-artifact@v4
        with:
          name: Boty-${{ github.ref_name }}-Windows
          path: build/windows/x64/runner/Boty-${{ github.ref_name }}-Windows.zip

  create-release:
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Boty-${{ github.ref_name }}-Android/Boty-${{ github.ref_name }}-Android.apk
            artifacts/Boty-${{ github.ref_name }}-Linux/Boty-${{ github.ref_name }}-Linux.zip
            artifacts/Boty-${{ github.ref_name }}-Windows/Boty-${{ github.ref_name }}-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
